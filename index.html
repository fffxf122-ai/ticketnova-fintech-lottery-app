<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TicketNova" />
    <meta name="description" content="TicketNova - Premium Lottery & Fintech Platform. Play Thailand Lottery, Kalyan Matka and more." />
    <meta name="keywords" content="lottery, fintech, betting, Thailand lottery, Kalyan Matka, mobile wallet" />
    <meta name="author" content="TicketNova" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="TicketNova | Premium Lottery Platform" />
    <meta property="og:description" content="Play premium lottery games with secure payments and instant payouts." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    
    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="TicketNova" />
    <meta name="msapplication-TileColor" content="#FFD700" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <title>TicketNova | Premium Lottery Platform</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Splash Screen Styles -->
    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        background: #0A0A0F;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash-logo {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #FFD700, #FF8C00);
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 800;
        font-size: 32px;
        color: #000;
        animation: pulse 2s ease-in-out infinite;
      }
      .splash-text {
        margin-top: 16px;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 24px;
        background: linear-gradient(135deg, #FFD700, #FF8C00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .splash-loading {
        margin-top: 32px;
        width: 40px;
        height: 4px;
        background: rgba(255,215,0,0.2);
        border-radius: 2px;
        overflow: hidden;
      }
      .splash-loading::after {
        content: '';
        display: block;
        width: 50%;
        height: 100%;
        background: linear-gradient(135deg, #FFD700, #FF8C00);
        border-radius: 2px;
        animation: loading 1s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(255,215,0,0.2); }
        50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(255,215,0,0.4); }
      }
      @keyframes loading {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen -->
    <div id="splash-screen">
      <div class="splash-logo">TN</div>
      <div class="splash-text">TicketNova</div>
      <div class="splash-loading"></div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Hide splash screen after app loads -->
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('splash-screen');
          if (splash) {
            splash.classList.add('hidden');
            setTimeout(function() {
              splash.remove();
            }, 300);
          }
        }, 500);
      });
    </script>
  </body>
</html>
